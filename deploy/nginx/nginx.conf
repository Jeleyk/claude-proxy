# claude-proxy edge router (no TLS — host nginx + Cloudflare terminate TLS and proxy here).
# Fans one origin out to the components:
#   /            → the `front` container (React SPA static)
#   /api, /healthz → the Kotlin service (management API)
#   /gateway, /v1  → the Anthropic datapath (service in Spec A; the Go gateway in Spec B)
#
# Upstream host names (`front`, `service`) are the docker-compose service aliases, resolved at
# startup; `depends_on: *_healthy` guarantees they exist before nginx boots. If a backing
# container is recreated with a new IP, `docker compose restart nginx` re-resolves it.
server {
    listen 8080;
    server_name _;

    # Match the service's raised Netty limits (large Claude Code headers) + large bodies.
    large_client_header_buffers 8 128k;
    client_max_body_size 100m;

    # ---- Management API + health → service ----
    location /api/ {
        proxy_pass http://service:8787;
        include /etc/nginx/proxy_common.conf;
    }
    location = /healthz {
        proxy_pass http://service:8787;
        include /etc/nginx/proxy_common.conf;
    }

    # ---- Anthropic datapath (proxy) → Go gateway (Spec B) ----
    # Trailing slash strips the /gateway prefix so the backend sees /v1/... . The Kotlin datapath
    # (service:8787) is kept running as an instant rollback — revert these two proxy_pass targets
    # back to http://service:8787 and rebuild nginx to fall back. Compose gates nginx on the Go
    # gateways only with `service_started` (not healthy), so a broken gateway module never blocks
    # this rollback or the rest of the edge router.
    location /gateway/ {
        proxy_pass http://gateway:9000/;
        include /etc/nginx/proxy_stream.conf;
    }
    # Legacy direct /v1 (tokens whose base URL is the bare domain) → same backend, path kept.
    location /v1/ {
        proxy_pass http://gateway:9000;
        include /etc/nginx/proxy_stream.conf;
    }

    # ---- API routing gateways (OpenAI/Anthropic emulation over Claude Code subscriptions) ----
    # Trailing slash strips the prefix so each backend sees its native path:
    #   base_url https://<host>/routing/openai/v1  → /v1/chat/completions on gateway-openai
    #   base_url https://<host>/routing/anthropic   → /v1/messages on gateway-anthropic
    # Both stream SSE, so they use the same SSE-safe settings as the datapath.
    location /routing/openai/ {
        proxy_pass http://gateway-openai:9100/;
        include /etc/nginx/proxy_stream.conf;
    }
    location /routing/anthropic/ {
        proxy_pass http://gateway-anthropic:9200/;
        include /etc/nginx/proxy_stream.conf;
    }

    # ---- SPA → front container (it owns the static build + client-routing fallback) ----
    location / {
        proxy_pass http://front:8080;
        include /etc/nginx/proxy_common.conf;
    }
}
