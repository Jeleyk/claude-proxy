# claude-proxy front — serves the React SPA static build only. No proxying: the edge router
# (deploy/nginx) sits in front and forwards `/` here; API/datapath never reach this container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA client-side routing: every unknown path returns index.html (react-router resolves it).
    location / {
        try_files $uri /index.html;
    }

    # index.html itself must never be cached, or a deploy won't reach clients.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
