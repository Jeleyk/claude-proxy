version: "2.4"

services:
  postgres:
    image: postgres:16-alpine
    container_name: claude-proxy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: claudeproxy
      POSTGRES_USER: claudeproxy
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-claudeproxy}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudeproxy"]
      interval: 5s
      timeout: 3s
      retries: 15

  claude-proxy:
    build: .
    image: claude-proxy:latest
    container_name: claude-proxy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Bind to localhost only; nginx fronts it with the domain + TLS.
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    environment:
      # Bind to all interfaces INSIDE the container so Docker's published port
      # (127.0.0.1:8787 on the host) can reach it. Overrides BIND_HOST from .env.
      BIND_HOST: "0.0.0.0"
      # Public domain — required so CORS allows the SPA's Origin (https://<domain>);
      # otherwise Ktor CORS answers /api/* with an empty 403. Also sets publicBaseUrl.
      PUBLIC_DOMAIN: "proxy.example.com"
      DATABASE_URL: jdbc:postgresql://postgres:5432/claudeproxy
      DATABASE_USER: claudeproxy
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-claudeproxy}
    volumes:
      - ./data:/data
