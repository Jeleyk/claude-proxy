services:
  claude-proxy:
    build: .
    image: claude-proxy:latest
    container_name: claude-proxy
    restart: unless-stopped
    # Bind to localhost only; a reverse proxy (nginx) fronts it with the domain.
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    volumes:
      - ./data:/data
